<!DOCTYPE html>

    <meta

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

  <body>
    <div class="page-shell">
      <header class="site-header">
        <nav class="navbar" aria-label="Hlavní navigace">
          <a class="brand" href="../home/">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>TrueBlock</span>
          </a>
          <div class="nav-links">

            <a class="nav-link active" href="../map/">Mapa</a>

          <iframe

            loading="lazy"
            referrerpolicy="no-referrer"
